server {
    listen 80;
    server_name _;

    client_max_body_size 15G;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;

    # Acesso controlado por login de sessao no app (Flask), nao mais Basic Auth.
    # Rotas internas (N8N) NUNCA pela porta 80: o N8N fala direto em 172.17.0.1:5001.
    # Via Nginx todo request chega como 127.0.0.1 (trusted) e furaria o gate de IP.
    location ~ ^/api/(callback|internal) {
        return 404;
    }

    location /static/ {
        alias /opt/opussb/static/;
        expires 1h;
    }

    location ~ ^/(api|health) {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location / {
        root /opt/opussb/static;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
