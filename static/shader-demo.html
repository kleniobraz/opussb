<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpusSB · Shader Animation (demo da porta vanilla)</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Equivalente vanilla do demo.tsx (Tailwind -> CSS): wrapper 650px, borda, título. */
    .demo-page { min-height: 100vh; display: grid; place-items: center; padding: 32px; gap: 20px; }
    .demo-wrap {
      position: relative; width: 100%; max-width: 1100px; height: 650px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; border-radius: 16px; border: 1px solid var(--border-strong);
      background: #1d4ed8; /* bg-blue-700, fica atrás do shader */
    }
    .demo-title {
      position: absolute; z-index: 10; pointer-events: none; text-align: center;
      font-size: clamp(40px, 9vw, 96px); line-height: 1; font-weight: 600;
      letter-spacing: -0.03em; color: #fff; white-space: pre-wrap;
    }
    .demo-note { font-size: 0.85rem; color: var(--ink-muted); text-align: center; max-width: 680px; line-height: 1.6; }
    .demo-note code { color: var(--gold); }
  </style>
</head>
<body>
  <div class="demo-page">
    <div class="demo-wrap" id="shader-demo">
      <span class="demo-title">Shader Animation</span>
    </div>
    <p class="demo-note">
      Porta vanilla do componente React. O Three.js é carregado sob demanda de
      <code>/js/vendor/three.min.js</code> na 1ª montagem. Montado via
      <code>OpusSB.shaderAnimation.mount('#shader-demo')</code>.
    </p>
  </div>

  <script src="/js/shader-animation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.__demoAnim = OpusSB.shaderAnimation.mount('#shader-demo');
    });
  </script>
</body>
</html>
