# Ground truth de UM vídeo pro tools/eval_revisor.py — copie este arquivo,
# renomeie pra <nome-do-video>.gt.yaml e preencha. Comentários com # são bem-vindos
# ao lado de qualquer linha. Só 'video' é obrigatório.

# Caminho do vídeo, relativo a ESTE arquivo (deixe o .mp4 na mesma pasta).
video: reels_ficticio_da_weevo.mp4

# Descrição livre; aparece no relatório pra você se localizar.
descricao: exemplo fictício mostrando todos os campos

# OPCIONAL: só pro vídeo original (Fixado Godoy). O script puxa o relatório
# antigo guardado no DB e compara lado a lado com as rodadas novas.
# original_review_id: 4164b944be174f439f0fece80f956f23

# OPCIONAL, mas recomendado: o texto FIEL da legenda queimada, palavra por
# palavra, DO JEITO QUE APARECE NA TELA (com os erros!). Habilita a métrica de
# cobertura de palavras. O | preserva as quebras de linha; escreva corrido.
texto_legenda: |
  estamos formando o grupo sb com muita forca e inteligencia
  no marketing a gente cria campanhas que vendem
  no comercial a Wevo fecha os contratos

# Os erros que VOCÊ sabe que estão no vídeo. Um item por erro:
#   trecho:  o texto ERRADO como aparece na tela (acentos contam!)
#   correto: a grafia certa
#   tipo:    opcional (ortografia | gramatica | marca | pontuacao | maiuscula | outro);
#            se preencher, o relatório avisa quando o revisor pegar o erro mas
#            classificar com outro tipo
erros:
  - trecho: inteligencia          # sem acento na tela
    correto: inteligência
    tipo: ortografia
  - trecho: Wevo                  # marca errada (canônico do glossário: Weevo)
    correto: Weevo
    tipo: marca

# ── Vídeo SEM erro (teste de falso positivo) ──────────────────────────────────
# Pra um vídeo limpo, marque a lista vazia. Aí todo finding que o revisor
# devolver conta como falso positivo, e essa vira a métrica do vídeo:
#
# erros: []    # vídeo limpo: mede só falso positivo
