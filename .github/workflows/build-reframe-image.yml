name: build-reframe-image

# Builda e publica a imagem do worker GPU de reframe no GitHub Container Registry (GHCR).
# Dispara só quando o worker ou a lógica compartilhada mudam (ou manualmente). A imagem é o que
# o endpoint serverless da RunPod puxa (ver BACKEND_CONTEXT §20). O pacote precisa ser PÚBLICO no
# GHCR (sem segredo na imagem) OU a RunPod precisa de um PAT read:packages pra puxar privado.

on:
  push:
    branches: [master]
    paths:
      - 'gpu_reframe/**'
      - 'reframe_core.py'
      - '.github/workflows/build-reframe-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gpu_reframe/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/opussb-reframe:latest
            ghcr.io/${{ github.repository_owner }}/opussb-reframe:${{ github.sha }}
